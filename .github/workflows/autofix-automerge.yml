name: Autofix Auto-Merge

# When CI passes on a claude/autofix/* branch, squash-merge the fix PR — but only if it
# clears FOUR independent, deterministic gates that do NOT rely on the triage agent's
# judgement (the agent shares a failure mode with the thing being checked):
#
#   1. LABEL GATE      — labeled automerge-on-green and NOT needs-human-review.
#   2. SCOPE GATE      — every changed file is under src/<SVC>/connectors/ or tests/,
#                        where SVC is derived from the repository name (not a wildcard),
#                        so a fix that invents src/anything/connectors/ cannot pass.
#   3. TRUTH GATE      — the PR may change how we FETCH (connector code) but not what the
#                        TRUTH is: any changed expected-value / assertion in tests/ (a
#                        number, a units string, a CRS/EPSG code, or a quality-flag enum)
#                        routes to a human. A stale-fixture refresh and a provider serving
#                        garbage are byte-identical fixes; only a human should canonize a
#                        new expected value. Bias is toward human review on ambiguity.
#   4. CIRCUIT BREAKER — if this connector has already been auto-fixed N+ times in the
#                        last WINDOW days, stop auto-merging it and open a needs-human
#                        issue: repeated drift means a provider relationship needs a person.
#
# This is the "merge when CI greens" half of the triage system; see
# .github/claude-triage-guide.md for the classification contract.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Circuit-breaker policy: trip if this many prior autofix merges already touched the
  # same connector within the window.
  CB_THRESHOLD: "3"
  CB_WINDOW_DAYS: "7"

jobs:
  automerge:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'claude/autofix/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible drift PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # Per-repo service slug (fixes the src/[^/]+/ wildcard): cas, cfs, csfs, cos.
          SVC=$(echo "$REPO" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')
          echo "Service slug: $SVC"

          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
                 --json number,labels --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR for $BRANCH — nothing to merge."; exit 0
          fi
          number=$(echo "$pr" | jq -r '.number')
          labels=$(echo "$pr" | jq -r '[.labels[].name]')

          # Relabel the PR for a human and post a comment body from a file.
          # $1 = path to a markdown body file.
          relabel_human() {
            gh pr edit -R "$REPO" "$number" \
              --remove-label automerge-on-green --add-label needs-human-review 2>/dev/null || true
            gh pr comment -R "$REPO" "$number" --body-file "$1" || true
          }

          # ---- Gate 1: label eligibility ----
          has_automerge=$(echo "$labels" | jq -r 'index("automerge-on-green") // empty')
          has_human=$(echo "$labels"     | jq -r 'index("needs-human-review") // empty')
          if [ -z "$has_automerge" ] || [ -n "$has_human" ]; then
            echo "PR #$number not label-eligible for auto-merge (labels: $labels) — leaving for a human."
            exit 0
          fi

          # ---- Gate 2: scope (deterministic, per-repo slug) ----
          files=$(gh pr diff -R "$REPO" "$number" --name-only)
          echo "Changed files:"; echo "$files"
          out_of_scope=$(echo "$files" | grep -vE "^(src/${SVC}/connectors/|tests/)" || true)
          if [ -n "$out_of_scope" ]; then
            echo "Out of scope:"; echo "$out_of_scope"
            printf '%s\n' "🤖 Auto-merge blocked (**scope gate**): this PR changes files outside \`src/${SVC}/connectors/\`/\`tests/\`, which is out of scope for an adapter/data-drift autofix. Relabeled \`needs-human-review\`." > /tmp/body.md
            relabel_human /tmp/body.md
            exit 0
          fi

          # ---- Gate 3: truth gate — no auto-canonizing a changed expected value ----
          # Recorded truth is not only inline asserts. Two classes route to a human:
          #   (a) ANY change to a non-.py file under tests/ (a recorded fixture/response/blob:
          #       .json/.csv/.nc/parquet/pickle/…). "Refresh the recording to what the provider
          #       now serves" is exactly the garbage-canonization case and it carries no keyword,
          #       so the whole file class is gated on sight.
          #   (b) In tests/*.py: a changed assertion, a semantic token (units/CRS/EPSG/quality
          #       flag), an expected/EXPECTED constant, OR any changed line bearing a bare numeric
          #       literal — catches `EXPECTED_DEM_MEAN = 132.4 → 187.2`, which has no assert/==.
          # Pure connector-code fixes and keyword-free, number-free test setup/import edits pass.
          # A false positive costs a human glance; a false negative launders provider-served
          # garbage into a green squash commit — so we deliberately err toward human review.
          diff=$(gh pr diff -R "$REPO" "$number")
          tripwire=$(printf '%s\n' "$diff" | awk '
            /^--- a\//         { old=substr($0,7); next }
            /^--- \/dev\/null/ { old="/dev/null"; next }
            /^\+\+\+ b\// {
              cur=substr($0,7); inpy=(cur ~ /^tests\/.*\.py$/)
              if (cur ~ /^tests\// && cur !~ /\.py$/) print "recorded fixture changed: " cur
              next
            }
            /^\+\+\+ \/dev\/null/ {
              inpy=0
              if (old ~ /^tests\// && old !~ /\.py$/) print "recorded fixture removed: " old
              next
            }
            /^@@/ { next }
            (inpy && /^[+-]/ && !/^(\+\+\+|---)/) {
              code=substr($0,2)
              if (code ~ /assert|approx|==|!=|<=|>=|expected|EXPECTED|\bunits\b|EPSG|epsg|\bcrs\b|GOOD|SUSPECT|PARTIAL|MISSING|DEGRADED|ESTIMATED/) { print; next }
              if (code ~ /(^|[^A-Za-z0-9_.])-?[0-9]/) print
            }
          ')
          if [ -n "$tripwire" ]; then
            echo "Truth-gate tripwire — changed expected values in tests/:"; echo "$tripwire"
            {
              printf '%s\n\n' "🤖 Auto-merge blocked (**truth gate**): this PR changes one or more **expected values / assertions** under \`tests/\` — a number, units string, CRS/EPSG code, or quality-flag enum. Updating a recorded expectation to match reality-as-served is indistinguishable, by any check the agent could run, from canonizing a provider that has silently started serving wrong data. A human must confirm the new expected value is correct. Relabeled \`needs-human-review\`."
              printf '%s\n' "Flagged lines:"
              printf '%s\n' '```diff'
              printf '%s\n' "$tripwire"
              printf '%s\n' '```'
            } > /tmp/body.md
            relabel_human /tmp/body.md
            exit 0
          fi

          # ---- Gate 4: circuit breaker — a human-controlled LATCH, not a timer ----
          # The tracking issue IS the breaker state. While an issue for this connector is OPEN,
          # auto-merge is paused, full stop — a human's judgement is the switch. Closing the
          # issue genuinely re-arms: the trip count only considers autofix merges NEWER than the
          # last close, so the merges that tripped it do not immediately re-trip. First trip:
          # >= CB_THRESHOLD autofix merges for this connector within CB_WINDOW_DAYS AND since the
          # last re-arm. (Count is over all claude-autofix merges — erring toward pausing, the
          # safe side for a breaker, rather than fail-open filtering by merge actor.)
          conns=$(echo "$files" | grep -E "^src/${SVC}/connectors/.*\.py$" || true)
          if [ -n "$conns" ]; then
            window_cut=$(date -u -d "${CB_WINDOW_DAYS} days ago" +%s)
            merged=$(gh pr list -R "$REPO" --state merged --label claude-autofix --limit 100 \
                       --json mergedAt,files 2>/dev/null || echo '[]')
            for conn in $conns; do
              title="🚨 Repeated drift autofixes: $conn"

              # Latched? An OPEN tracking issue means paused until a human closes it.
              open_no=$(gh issue list -R "$REPO" --state open --search "in:title $conn" \
                          --json number,title \
                          --jq "[.[] | select(.title==\"$title\")][0].number" 2>/dev/null || true)
              if [ -n "$open_no" ] && [ "$open_no" != "null" ]; then
                printf '%s\n' "🤖 Auto-merge blocked (**circuit breaker latched**): tracking issue #$open_no for \`$conn\` is open. Auto-merge stays paused until a human closes it — closing the issue is the re-arm. Relabeled \`needs-human-review\`." > /tmp/body.md
                relabel_human /tmp/body.md
                exit 0
              fi

              # Re-arm baseline: newest close of a prior tracking issue for this connector.
              # Only merges at/after this instant (and within the window) count toward a new trip.
              closed_at=$(gh issue list -R "$REPO" --state closed --search "in:title $conn" \
                            --json title,closedAt \
                            --jq "[.[] | select(.title==\"$title\")] | sort_by(.closedAt) | reverse | .[0].closedAt // empty" 2>/dev/null || true)
              baseline=$window_cut
              if [ -n "$closed_at" ]; then
                ca=$(date -u -d "$closed_at" +%s 2>/dev/null || echo 0)
                [ "$ca" -gt "$baseline" ] && baseline=$ca
              fi

              count=$(printf '%s' "$merged" | jq --arg conn "$conn" --argjson base "$baseline" '
                [ .[]
                  | select(.mergedAt != null and (.mergedAt|fromdateiso8601) >= $base)
                  | select([.files[]?.path] | index($conn)) ] | length')
              echo "Connector $conn: $count autofix merge(s) since re-arm baseline (threshold ${CB_THRESHOLD})."

              if [ "$count" -ge "${CB_THRESHOLD}" ]; then
                printf '%s\n\n%s\n' \
                  "The circuit breaker tripped: \`$conn\` has been auto-fixed **${count}** time(s) since the last re-arm (window ${CB_WINDOW_DAYS}d, threshold ${CB_THRESHOLD}). Auto-merge is now **paused** for this connector." \
                  "Repeated automated drift on one connector usually means the provider relationship itself needs attention (a staged endpoint deprecation, a churning coverage/layer id, an auth or format change in flight) rather than another mechanical fixture refresh. Review the recent autofix PRs for this connector. **Closing this issue re-arms auto-merge** for \`$conn\` — only merges after the close count toward the next trip." > /tmp/issue.md
                gh issue create -R "$REPO" --title "$title" --label needs-human-review --body-file /tmp/issue.md || true
                printf '%s\n' "🤖 Auto-merge blocked (**circuit breaker**): \`$conn\` auto-fixed ${count}× since last re-arm. Opened a tracking issue; auto-merge is paused until a human closes it. Relabeled \`needs-human-review\`." > /tmp/body.md
                relabel_human /tmp/body.md
                exit 0
              fi
            done
          fi

          # ---- All gates cleared ----
          echo "PR #$number cleared all gates (label, scope, truth, circuit breaker) — squash-merging."
          gh pr merge -R "$REPO" "$number" --squash --delete-branch
