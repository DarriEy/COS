name: Windows Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Windows compatibility tests
        run: python -m pytest tests/test_config.py tests/test_models.py tests/test_suite_contract.py -q -p no:cacheprovider --no-cov

