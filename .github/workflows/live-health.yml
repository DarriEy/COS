name: Live Connector Health

on:
  push:
    branches:
      - "release/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Export validation inventory
        run: cos validation --json-output > validation-report.json
      - name: Run bounded anonymous provider sentinels
        run: pytest tests/connectors -m anonymous_live --no-cov --tb=short -q --junitxml=live-health.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-connector-health
          path: |
            validation-report.json
            live-health.xml

  credential-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      OPENET_API_KEY: ${{ secrets.OPENET_API_KEY }}
      AMERIFLUX_USER_ID: ${{ secrets.AMERIFLUX_USER_ID }}
      AMERIFLUX_USER_EMAIL: ${{ secrets.AMERIFLUX_USER_EMAIL }}
      GLEAM_USERNAME: ${{ secrets.GLEAM_USERNAME }}
      GLEAM_PASSWORD: ${{ secrets.GLEAM_PASSWORD }}
      ISMN_USERNAME: ${{ secrets.ISMN_USERNAME }}
      ISMN_PASSWORD: ${{ secrets.ISMN_PASSWORD }}
      GLOH2O_USERNAME: ${{ secrets.GLOH2O_USERNAME }}
      GLOH2O_PASSWORD: ${{ secrets.GLOH2O_PASSWORD }}
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Export secret-free credential readiness
        run: cos doctor --json-output > credential-readiness.json
      - name: Run configured credentialed sentinels
        run: pytest tests/connectors -m credential_live --no-cov --tb=short -q --junitxml=credential-health.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-connector-health
          path: |
            credential-readiness.json
            credential-health.xml
