name: Live Connector Health

on:
  push:
    branches:
      - "release/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Export validation inventory
        run: cos validation --json-output > validation-report.json
      - name: Export operational roster status
        run: cos health --json-output > health-status.json
      - name: Run bounded anonymous provider sentinels
        id: sentinels
        shell: bash
        run: |
          set +e
          pytest tests/connectors -m anonymous_live --no-cov --tb=short -q --junitxml=live-health.xml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Incorporate sentinel outcome into operational status
        if: always()
        env:
          SENTINEL_EXIT_CODE: ${{ steps.sentinels.outputs.exit_code }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from xml.etree import ElementTree

          status_path = Path("health-status.json")
          try:
              status = json.loads(status_path.read_text(encoding="utf-8"))
          except (OSError, ValueError, TypeError):
              status = {
                  "schema_version": 1,
                  "generated_at": datetime.now(UTC).isoformat(),
                  "service": "cos",
                  "summary": {},
                  "lifecycle": {},
                  "connectors": [],
                  "degraded": [],
                  "reasons": {},
              }

          exit_code = os.environ.get("SENTINEL_EXIT_CODE", "")
          passed = exit_code == "0"
          sentinel = {"exit_code": int(exit_code) if exit_code.isdigit() else None}
          report_path = Path("live-health.xml")
          try:
              root = ElementTree.parse(report_path).getroot()
              sentinel.update({
                  key: int(root.attrib.get(key, 0))
                  for key in ("tests", "failures", "errors", "skipped")
              })
          except (OSError, ValueError, ElementTree.ParseError):
              sentinel["report_missing"] = True
              passed = False

          status["sentinels"] = {"anonymous_live": sentinel}
          if not passed:
              status["status"] = "degraded"
              degraded = status.setdefault("degraded", [])
              if "anonymous_live" not in degraded:
                  degraded.append("anonymous_live")
              status.setdefault("reasons", {})["sentinel:anonymous_live"] = [
                  "anonymous_live"
              ]
          status_path.write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-connector-health
          path: |
            validation-report.json
            health-status.json
            live-health.xml
      - name: Fail when anonymous sentinels failed
        if: always() && steps.sentinels.outputs.exit_code != '0'
        run: exit 1

  credential-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      OPENET_API_KEY: ${{ secrets.OPENET_API_KEY }}
      AMERIFLUX_USER_ID: ${{ secrets.AMERIFLUX_USER_ID }}
      AMERIFLUX_USER_EMAIL: ${{ secrets.AMERIFLUX_USER_EMAIL }}
      GLEAM_USERNAME: ${{ secrets.GLEAM_USERNAME }}
      GLEAM_PASSWORD: ${{ secrets.GLEAM_PASSWORD }}
      ISMN_USERNAME: ${{ secrets.ISMN_USERNAME }}
      ISMN_PASSWORD: ${{ secrets.ISMN_PASSWORD }}
      GLOH2O_USERNAME: ${{ secrets.GLOH2O_USERNAME }}
      GLOH2O_PASSWORD: ${{ secrets.GLOH2O_PASSWORD }}
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Export secret-free credential readiness
        run: cos doctor --json-output > credential-readiness.json
      - name: Run configured credentialed sentinels
        run: pytest tests/connectors -m credential_live --no-cov --tb=short -q --junitxml=credential-health.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-connector-health
          path: |
            credential-readiness.json
            credential-health.xml
